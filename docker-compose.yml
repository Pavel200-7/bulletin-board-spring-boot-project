services:
  
  nginx:
    image: nginx:latest
    volumes:
      - ./config/Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      app-net:
    depends_on:
      - apigateway 

  apigateway:
    build: ./service/apigateway
    container_name: apigateway
    environment:
      # Servise path
      - BULLETIN_SERVICE_PATH=bulletin:8080
      - NOTIFICATION_SERVICE_PATH=notification:8080
      - CHAT_SERVICE_PATH=chat:8080
      - KEYCLOAK_PATH=keycloak:8080
      - AUTH_PATH=auth:8080
      # Server
      - SERVER_PORT=8080 
    networks:
      app-net:
    depends_on:
      - bulletin
      - notification
      - chat

  bulletin:
    build: ./service/bulletin
    container_name: bulletin
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/bulletin_db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=password
      
      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rmuser
      - RABBITMQ_PASSWORD=rmpassword
      
      # Keycloak
      - KEYCLOAK_ISSUER_URI=http://localhost:8090/realms/oAuth
      - DOCKER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/oAuth
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      
      # Server
      - SERVER_PORT=8080 
    networks:
      app-net:
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    build: ./service/notification
    container_name: notification
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/notification_db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=password
      
      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rmuser
      - RABBITMQ_PASSWORD=rmpassword
      
      # Keycloak
      - KEYCLOAK_ISSUER_URI=http://localhost:8090/realms/oAuth
      - DOCKER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/oAuth
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC

      # Mail
      - MAIL_HOST=smtp.yandex.ru
      - MAIL_PORT=465
      - MAIL_PROTOCOL=smtps
      - MAIL_USERNAME=Pavel200-7@yandex.ru
      - MAIL_PASSWORD=prvepeophfnvnjlm
      
      # Server
      - SERVER_PORT=8080 
    networks:
      app-net:
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  chat:
    build: ./service/chat
    container_name: chat
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/chat_db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=password
      
      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rmuser
      - RABBITMQ_PASSWORD=rmpassword
      
      # Keycloak
      - KEYCLOAK_ISSUER_URI=http://localhost:8090/realms/oAuth
      - DOCKER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/oAuth
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      
      # Server
      - SERVER_PORT=8080 
    networks:
      app-net:
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  auth:
    build: ./service/auth
    container_name: auth
    environment:
      - SERVER_PORT=8080
      - KEYCLOAK_AUTH_URI=http://localhost:8090/realms/oAuth/protocol/openid-connect/auth
      - KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/oAuth/protocol/openid-connect/token
      - KEYCLOAK_LOGOUT_URI=http://keycloak:8080/realms/oAuth/protocol/openid-connect/logout
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      - BACKEND_CALLBACK_URI=http://localhost:8080/api/v1/auth/callback
      - FRONTEND_REDIRECT_URI=http://localhost:5173/callback
    networks:
      - app-net
    depends_on:
      keycloak:
          condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    volumes:
     - ./config/keycloak/import:/opt/keycloak/data/import:ro 
     - ./config/keycloak/spi-providers:/opt/keycloak/providers
    ports:
      - 9000:9000      
      - 8090:8080
    environment:
      # БД 
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB=postgres
      - KC_DB_USERNAME=dbuser
      - KC_DB_PASSWORD=password
      # Базовый админ
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Импорт конфигурации
      - KC_IMPORT=/opt/keycloak/data/import/realm-export.json
      # SMTP
      - KC_SMTP_FROM=noreply@yourdomain.com
      - KC_SMTP_HOST=smtp.yandex.ru
      - KC_SMTP_PORT=465
      - KC_SMTP_USER=Pavel200-7@yandex.ru
      - KC_SMTP_PASSWORD=prvepeophfnvnjlm
      - KC_SMTP_STARTTLS=true
      - KC_SMTP_AUTH=true
      # Разное
      - KC_HOSTNAME_URL=http://localhost:8090
      - KC_HOSTNAME_ADMIN_URL=http://localhost:8090 
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8090
      - KC_PROXY=edge
      - KC_HTTP_ENABLED=true
      - KC_SPI_COOKIE_DEFAULT_SAMESITE=None
      - KC_SPI_COOKIE_DEFAULT_SECURE=false
      - KC_HOSTNAME_STRICT=false
      - KC_HEALTH_ENABLED=true
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    command: 
      - start-dev
      - --import-realm
      - --spi-import-provider-single-file-file=/opt/keycloak/data/import/realm-export.json
      - --spi-import-provider-single-file-override=false
      - --spi-events-listener-my-event-listener-enabled=true
      - --spi-events-listener-my-event-listener-rabbitmqhost=rabbitmq
      - --spi-events-listener-my-event-listener-rabbitmqport=5672 
      - --spi-events-listener-my-event-listener-rabbitmqusername=rmuser
      - --spi-events-listener-my-event-listener-rabbitmqpassword=rmpassword
      - --spi-events-listener-my-event-listener-rabbitmqvirtualhost=/
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    volumes:
      - postgres-db-vol:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    networks:
      app-net:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    networks:
      app-net:
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    volumes:
      - rabbitmq-db-vol:/var/lib/rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=rmuser
      - RABBITMQ_DEFAULT_PASS=rmpassword
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
    networks:
      app-net:
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server --console-address ":9002" /data/  
    ports:
      - "9001:9000"   
      - "9002:9002"   
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: password
      MINIO_BROWSER: on
    volumes:
      - minio-db-vol:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

networks:
  app-net:
    ipam:
      driver: default

volumes:
  postgres-db-vol:
  rabbitmq-db-vol:
  minio-db-vol:
