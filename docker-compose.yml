version: '3.8'

services:
  # ============================================
  # NGINX (Единая точка входа)
  # ============================================
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./config/Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - app-net
    depends_on:
      - client
      - apigateway
      - keycloak
      - minio

  # ============================================
  # CLIENT (Vue.js Frontend)
  # ============================================
  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://localhost
        - VITE_KEYCLOAK_URL=http://localhost/auth
        - VITE_KEYCLOAK_CLIENT_ID=myclient
        - VITE_APP_URL=http://localhost
        - VITE_MINIO_URL=http://localhost/minio
        - VITE_MINIO_BUCKET=bulletins
    container_name: client
    # environment:
    #   - VITE_API_URL=http://localhost/api
    #   - VITE_KEYCLOAK_URL=http://localhost/auth
    #   - VITE_KEYCLOAK_CLIENT_ID=myclient
    #   - VITE_APP_URL=http://localhost
    #   - VITE_MINIO_URL=http://localhost/minio
    #   - VITE_MINIO_BUCKET=bulletins
    networks:
      - app-net
    depends_on:
      - apigateway
      - keycloak
      - minio

  # ============================================
  # API GATEWAY
  # ============================================
  apigateway:
    build: ./service/apigateway
    container_name: apigateway
    environment:
      - SERVER_PORT=8080
      - EUREKA_PATH=http://eureka:8761/eureka/
      # - BULLETIN_SERVICE_PATH=bulletin:8080
      # - NOTIFICATION_SERVICE_PATH=notification:8080
      # - CHAT_SERVICE_PATH=chat:8080
      # - KEYCLOAK_PATH=keycloak:8080
      # - AUTH_PATH=auth:8080
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
    networks:
      - app-net
    depends_on:
      - eureka
      - bulletin
      - notification
      - chat
      - auth

  # ============================================
  # EUREKA
  # ============================================
  eureka:
    build: ./service/eureka
    container_name: eureka
    environment:
      - SERVER_PORT=8761
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ============================================
  # AUTH SERVICE
  # ============================================
  auth:
    build: ./service/auth
    container_name: auth
    environment:
      - SERVER_PORT=8080
      - EUREKA_PATH=http://eureka:8761/eureka/
      - KEYCLOAK_AUTH_URI=http://localhost/auth/realms/oAuth/protocol/openid-connect/auth
      - KEYCLOAK_TOKEN_URI=http://keycloak:8080/realms/oAuth/protocol/openid-connect/token
      - KEYCLOAK_LOGOUT_URI=http://localhost/auth/realms/oAuth/protocol/openid-connect/logout
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      - BACKEND_CALLBACK_URI=http://localhost/api/v1/auth/callback
      - FRONTEND_REDIRECT_URI=http://localhost/callback
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
    networks:
      - app-net
    depends_on:
      - eureka
      - keycloak

  # ============================================
  # BULLETIN SERVICE
  # ============================================
  bulletin:
    build: ./service/bulletin
    container_name: bulletin
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/bulletin_db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rmuser
      - RABBITMQ_PASSWORD=rmpassword
      - KEYCLOAK_ISSUER_URI=http://localhost/auth/realms/oAuth
      - DOCKER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/oAuth
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      - EUREKA_PATH=http://eureka:8761/eureka/
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
    networks:
      - app-net
    depends_on:
      - eureka
      - keycloak
      - postgres
      - rabbitmq

  # ============================================
  # NOTIFICATION SERVICE
  # ============================================
  notification:
    build: ./service/notification
    container_name: notification
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/notification_db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rmuser
      - RABBITMQ_PASSWORD=rmpassword
      - KEYCLOAK_ISSUER_URI=http://localhost/auth/realms/oAuth
      - DOCKER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/oAuth
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      - MAIL_HOST=smtp.yandex.ru
      - MAIL_PORT=465
      - MAIL_PROTOCOL=smtps
      - MAIL_USERNAME=Pavel200-7@yandex.ru
      - MAIL_PASSWORD=prvepeophfnvnjlm
      - EUREKA_PATH=http://eureka:8761/eureka/
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
    networks:
      - app-net
    depends_on:
      - eureka
      - keycloak
      - postgres
      - rabbitmq

  # ============================================
  # CHAT SERVICE
  # ============================================
  chat:
    build: ./service/chat
    container_name: chat
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/chat_db
      - DB_USERNAME=dbuser
      - DB_PASSWORD=password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=rmuser
      - RABBITMQ_PASSWORD=rmpassword
      - KEYCLOAK_ISSUER_URI=http://localhost/auth/realms/oAuth
      - DOCKER_KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/oAuth
      - KEYCLOAK_CLIENT_ID=myclient
      - KEYCLOAK_CLIENT_SECRET=sYXnZMAiSY4ouudztjv73iHyPr5H0dQC
      - EUREKA_PATH=http://eureka:8761/eureka/
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_SECURITY_ENABLED=false
    networks:
      - app-net
    depends_on:
      - eureka
      - keycloak
      - postgres
      - rabbitmq

  # ============================================
  # KEYCLOAK
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    ports:
      - "9000:8080"
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import:ro
      - ./config/keycloak/spi-providers:/opt/keycloak/providers
    environment:
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak_db
      - KC_DB=postgres
      - KC_DB_USERNAME=dbuser
      - KC_DB_PASSWORD=password
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_IMPORT=/opt/keycloak/data/import/realm-export.json
      - KC_SMTP_FROM=noreply@yourdomain.com
      - KC_SMTP_HOST=smtp.yandex.ru
      - KC_SMTP_PORT=465
      - KC_SMTP_USER=Pavel200-7@yandex.ru
      - KC_SMTP_PASSWORD=prvepeophfnvnjlm
      - KC_SMTP_STARTTLS=true
      - KC_SMTP_AUTH=true
      - KC_HOSTNAME_URL=http://localhost/auth
      - KC_HOSTNAME_ADMIN_URL=http://localhost/auth
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY=edge
      - PROXY_ADDRESS_FORWARDING=true
      - KC_HTTP_ENABLED=true
      - KC_SPI_COOKIE_DEFAULT_SAMESITE=None
      - KC_SPI_COOKIE_DEFAULT_SECURE=false
      - KC_HEALTH_ENABLED=true
    command:
      - start-dev
      - --import-realm
      - --spi-import-provider-single-file-file=/opt/keycloak/data/import/realm-export.json
      - --spi-import-provider-single-file-override=false
      - --spi-events-listener-my-event-listener-enabled=true
      - --spi-events-listener-my-event-listener-rabbitmqhost=rabbitmq
      - --spi-events-listener-my-event-listener-rabbitmqport=5672
      - --spi-events-listener-my-event-listener-rabbitmqusername=rmuser
      - --spi-events-listener-my-event-listener-rabbitmqpassword=rmpassword
      - --spi-events-listener-my-event-listener-rabbitmqvirtualhost=/
    networks:
      - app-net
    depends_on:
      - postgres
      - rabbitmq

  # ============================================
  # POSTGRESQL
  # ============================================
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    volumes:
      - postgres-db-vol:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql:ro
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # PGADMIN (опционально)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    networks:
      - app-net
    depends_on:
      - postgres

  # ============================================
  # RABBITMQ
  # ============================================
  rabbitmq:
    image: rabbitmq:3.10.7-management
    container_name: rabbitmq
    volumes:
      - rabbitmq-db-vol:/var/lib/rabbitmq
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=rmuser
      - RABBITMQ_DEFAULT_PASS=rmpassword
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # MINIO
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server --console-address ":9002" /data/
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: password
      MINIO_BROWSER: on
      MINIO_SERVER_URL: http://localhost/minio
      MINIO_BROWSER_REDIRECT_URL: http://localhost/minio/console
    volumes:
      - minio-db-vol:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

networks:
  app-net:
    driver: bridge

volumes:
  postgres-db-vol:
  rabbitmq-db-vol:
  minio-db-vol: