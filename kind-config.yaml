kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bulletinboard-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
    labels:
      ingress-ready: true
  - role: worker
    labels:
      ingress-ready: true
  - role: worker
    labels:
      ingress-ready: true