minio:
  build: ./config/minio
  container_name: minio
  command: server --console-address ":9002" /data/
  ports:
    - "9001:9000"   # API порт
    - "9002:9002"   # Console порт
  environment:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: password
    MINIO_BROWSER: on
  volumes:
    - minio-db-vol:/data
    - ./config/minio/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
  networks:
    - app-net
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
    interval: 30s
    timeout: 20s
    retries: 3
    start_period: 30s