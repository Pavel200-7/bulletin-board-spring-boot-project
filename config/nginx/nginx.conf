events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Настройки проксирования
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 80;

    server {
        listen 80;
        server_name localhost;

        # ========================================
        # Frontend (Vue.js)
        # ========================================
        location / {
            proxy_pass http://client:5173/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ========================================
        # API Gateway
        # ========================================
        location /api/ {
            proxy_pass http://apigateway:8080;
        }

        # ========================================
        # Keycloak
        # ========================================
        location /auth/ {
            proxy_pass http://keycloak:8080/;
            sub_filter_once off;
            sub_filter 'http://keycloak:8080' 'http://localhost/auth';
        }

        # ========================================
        # MinIO API
        # ========================================
        location /minio/ {
            proxy_pass http://minio:9000/;
        }

        # ========================================
        # MinIO Console
        # ========================================
        location /minio/console/ {
            proxy_pass http://minio:9002/;
            proxy_set_header X-Forwarded-Prefix /minio/console;
        }

        # ========================================
        # Actuator endpoints (для отладки)
        # ========================================
        location /actuator/health {
            proxy_pass http://apigateway:8080/actuator/health;
        }
    }
}