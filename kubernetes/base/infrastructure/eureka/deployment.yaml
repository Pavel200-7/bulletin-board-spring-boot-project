apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  labels:
    app: eureka
    component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
        component: discovery
    spec:
      containers:
      - name: eureka
        image: pavel2007/eureka:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8761
        env:
        # Из common-config (управление)
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        - name: MANAGEMENT_SECURITY_ENABLED
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_SECURITY_ENABLED
        # Из eureka-config (специфичные)
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: eureka-config
              key: SERVER_PORT
        # Liveness probe (healthcheck)
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"