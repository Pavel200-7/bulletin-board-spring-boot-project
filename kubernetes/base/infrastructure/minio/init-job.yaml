apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: bulletinboard
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          # Ждать, пока MinIO запустится
          until mc alias set myminio http://minio-service:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD; do
            echo "Waiting for MinIO service..."
            sleep 5
          done
          
          # Создать бакет
          mc mb myminio/bulletins --ignore-existing
          
          # Вариант 1: Полный публичный доступ (read+write) - самый простой
          mc anonymous set public myminio/bulletins
          
          echo "Bucket 'bulletins' initialized successfully"
          echo "Current policy:"
          mc anonymous get myminio/bulletins
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            configMapKeyRef:
              name: minio-config
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: common-secret
              key: MINIO_ROOT_PASSWORD