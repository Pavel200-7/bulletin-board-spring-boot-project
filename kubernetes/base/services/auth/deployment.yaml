apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    component: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        component: security
    spec:
      containers:
      - name: auth
        image: pavel2007/auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        # Из common-config
        - name: EUREKA_PATH
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: EUREKA_PATH
        - name: KEYCLOAK_TOKEN_URI
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: KEYCLOAK_TOKEN_URI
        - name: KEYCLOAK_LOGOUT_URI
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: KEYCLOAK_LOGOUT_URI
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: KEYCLOAK_CLIENT_ID
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        - name: MANAGEMENT_SECURITY_ENABLED
          valueFrom:
            configMapKeyRef:
              name: common-config
              key: MANAGEMENT_SECURITY_ENABLED
        # Из common-secret
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: common-secret
              key: KEYCLOAK_CLIENT_SECRET
        # Из auth-config
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: SERVER_PORT
        - name: KEYCLOAK_AUTH_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: KEYCLOAK_AUTH_URI
        - name: BACKEND_CALLBACK_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: BACKEND_CALLBACK_URI
        - name: FRONTEND_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: FRONTEND_REDIRECT_URI      
        - name: EUREKA_INSTANCE_HOSTNAME
          valueFrom:
              configMapKeyRef:
                name: auth-config
                key: EUREKA_INSTANCE_HOSTNAME
        - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
          valueFrom:
              configMapKeyRef:
                name: auth-config
                key: EUREKA_INSTANCE_PREFER_IP_ADDRESS
        - name: EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED
          valueFrom:
              configMapKeyRef:
                name: auth-config
                key: EUREKA_INSTANCE_NON_SECURE_PORT_ENABLED
        - name: EUREKA_INSTANCE_NON_SECURE_PORT
          valueFrom:
              configMapKeyRef:
                name: auth-config
                key: EUREKA_INSTANCE_NON_SECURE_PORT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"