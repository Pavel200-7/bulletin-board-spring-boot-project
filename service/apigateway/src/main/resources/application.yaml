spring:
  application:
    name: apigateway

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

    # Детальные логи Tomcat
    org.apache.coyote.http11.Http11InputBuffer: DEBUG
    org.apache.catalina.connector.CoyoteAdapter: DEBUG
    org.apache.catalina.core.StandardEngine: DEBUG

    # Для видимости raw запроса/ответа
    org.apache.tomcat.util.net: DEBUG
    org.apache.tomcat.util.http: DEBUG

app:
  service-path:
    bulletin: ${BULLETIN_SERVICE_PATH:bulletin:8080}
    notification: ${NOTIFICATION_SERVICE_PATH:notification:8080}
    chat: ${CHAT_SERVICE_PATH:chat:8080}
    keycloak: ${KEYCLOAK_PATH:keycloak:8080}