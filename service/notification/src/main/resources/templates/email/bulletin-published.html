<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое объявление от [[${publisherName}]]</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            color: #1e293b;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px;
            background-color: #f8fafc;
        }
        .header {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 32px 24px;
            text-align: left;
            border-radius: 8px 8px 0 0;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.025em;
        }
        .content {
            background-color: #ffffff;
            padding: 32px 24px;
            border-radius: 0 0 8px 8px;
            border: 1px solid #e2e8f0;
            border-top: none;
        }
        .bulletin-info {
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 6px;
            margin: 24px 0;
            border-left: 3px solid #0f172a;
        }
        .publisher {
            font-size: 16px;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .bulletin-name {
            font-size: 20px;
            color: #0f172a;
            margin: 0 0 8px 0;
            font-weight: 600;
            line-height: 1.4;
        }
        .bulletin-name span {
            display: inline;
        }
        .price {
            font-size: 18px;
            color: #0f172a;
            font-weight: 500;
            margin: 12px 0 0 0;
        }
        .price span {
            color: #475569;
            font-weight: normal;
        }
        .message {
            color: #334155;
            margin: 24px 0;
            font-size: 16px;
        }
        .message strong {
            color: #0f172a;
            font-weight: 600;
        }
        .button {
            display: inline-block;
            padding: 12px 28px;
            background-color: #0f172a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 16px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.025em;
            transition: background-color 0.2s ease;
        }
        .button:hover {
            background-color: #1e293b;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 32px 0 24px;
        }
        .footer {
            text-align: left;
            color: #64748b;
            font-size: 14px;
        }
        .footer a {
            color: #0f172a;
            text-decoration: none;
            border-bottom: 1px dotted #94a3b8;
        }
        .footer a:hover {
            border-bottom: 1px solid #0f172a;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>📢 Новое объявление</h1>
</div>

<div class="content">
    <div class="publisher">
        <span th:text="${publisherName}"></span>
    </div>

    <div class="bulletin-info">
        <div class="bulletin-name">
            📌 <span th:text="${bulletinName}"></span>
        </div>
        <p class="price" th:if="${bulletinPrice}">
            <span>Цена:</span> <span th:text="${bulletinPrice}"></span> ₽
        </p>
    </div>

    <p class="message">
        Пользователь <strong th:text="${publisherName}"></strong>
        только что опубликовал новое объявление
        "<strong th:text="${bulletinName}"></strong>".
    </p>

    <a th:href="${bulletinUrl}" class="button">Посмотреть объявление →</a>
</div>
</body>
</html>
